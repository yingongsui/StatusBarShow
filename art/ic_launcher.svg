<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Radar Sweep Radial Gradient -->
    <radialGradient id="radarDistanceGrad" cx="256" cy="256" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="15%" stop-color="#40C4FF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#027DFD" stop-opacity="0.4" />
      <stop offset="95%" stop-color="#01579B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#01579B" stop-opacity="0" />
    </radialGradient>

    <!-- Monitor Waveform Linear Gradient -->
    <linearGradient id="monitorCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Squircle Clip -->
    <clipPath id="squircleClip">
      <path d="M 256,16 C 390,16 496,122 496,256 C 496,390 390,496 256,496 C 122,496 16,390 16,256 C 16,122 122,16 256,16 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Radar Coordinate Grid -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />
    <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
    <line x1="256" y1="56" x2="256" y2="456" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    <line x1="56" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

    <!-- Radar Sweep Sector -->
    <path d="M 256,256 L 307.2,64.7 A 198,198 0 0,1 427.5,157.0 Z" fill="url(#radarDistanceGrad)" />

    <!-- Concentric Target Rings -->
    <circle cx="256" cy="256" r="55" fill="none" stroke="#00BCD4" stroke-opacity="0.4" stroke-width="2" />
    <circle cx="256" cy="256" r="105" fill="none" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2" />

    <!-- Glowing Waveform Background Glow -->
    <path d="M 120,256 L 155,256 L 180,210 L 210,290 L 240,170 L 275,270 L 310,200 L 340,256 L 392,256" fill="none" stroke="#00F2FE" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35" />

    <!-- Primary Gradient Monitoring Waveform -->
    <path d="M 120,256 L 155,256 L 180,210 L 210,290 L 240,170 L 275,270 L 310,200 L 340,256 L 392,256" fill="none" stroke="url(#monitorCyan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Core Highlight Line -->
    <path d="M 120,256 L 155,256 L 180,210 L 210,290 L 240,170 L 275,270 L 310,200 L 340,256 L 392,256" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95" />

    <!-- Metric Focus Dots -->
    <circle cx="240" cy="170" r="6.5" fill="#00F2FE" />
    <circle cx="240" cy="170" r="3" fill="#FFFFFF" />
    <circle cx="310" cy="200" r="6.5" fill="#00F2FE" />
    <circle cx="310" cy="200" r="3" fill="#FFFFFF" />
  </g>

  <!-- Outline Rim Glow -->
  <path d="M 256,16 C 390,16 496,122 496,256 C 496,390 390,496 256,496 C 122,496 16,390 16,256 C 16,122 122,16 256,16 Z" fill="none" stroke="#40C4FF" stroke-width="3" stroke-opacity="0.3" />
</svg>
